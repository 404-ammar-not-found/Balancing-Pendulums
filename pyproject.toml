[project]
name = "double-pendulum-rl"
version = "0.1.0"
description = "Double inverted pendulum on a cart: RL (SAC) vs classical control (LQR)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "sympy>=1.12",
    "gymnasium>=0.29",
    "stable-baselines3>=2.3",
    "torch>=2.2",
    "matplotlib>=3.8",
    "numba>=0.59",
    "pygame>=2.5",
    "tensorboard>=2.16",
    "imageio>=2.34",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
